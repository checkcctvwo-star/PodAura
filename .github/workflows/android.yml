name: Android Build

on:
  push:
    branches: [master, feature/podcast-downloader]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Tests
        run: ./gradlew test

      - name: Assemble Debug APK
        run: ./gradlew :platform:android:app:assembleGithubDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: platform/android/app/build/outputs/apk/GitHub/debug/*.apk
          compression-level: 9

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**

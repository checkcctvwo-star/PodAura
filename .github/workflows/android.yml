name: Android Build

on:
  push:
    branches: [master, feature/podcast-downloader]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Disable the cross-run Gradle build cache. KMP metadata (.klib) for local modules
          # (e.g. fundation) can be restored stale across runs, hiding newly-added expect
          # declarations from downstream modules. A clean from-source compile avoids that.
          cache-disabled: true

      - name: Run Tests
        run: ./gradlew test --no-build-cache

      - name: Assemble Debug APK
        run: ./gradlew :platform:android:app:assembleGithubDebug --no-build-cache

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: platform/android/app/build/outputs/apk/GitHub/debug/*.apk
          compression-level: 9

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**

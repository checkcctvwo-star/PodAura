name: Android Build

on:
  push:
    branches: [master, feature/podcast-downloader]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Tests
        run: ./gradlew test

      - name: Assemble Debug APK
        run: ./gradlew :platform:android:app:assembleGithubDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: platform/android/app/build/outputs/apk/GitHub/debug/*.apk
          compression-level: 9

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Assemble Debug APK
        run: ./gradlew :platform:android:app:assembleGithubDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp platform/android/app/build/outputs/apk/GitHub/debug/*.apk "release/PodAura-podcast-downloader-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release and Upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "PodAura Podcast Downloader ${GITHUB_REF_NAME}" \
            --notes "Auto-built debug APK for the podcast-downloader + transcode-to-MP3 fork.

          ## Install
          Download the APK below, allow installs from unknown sources, and open it.

          ## What's included
          - Subscribe to podcast RSS feeds and download episodes.
          - Auto-transcode downloads to MP3 (FFmpegKit + libmp3lame), configurable bitrate (64/96/128/192 kbps).
          - Write transcoded files to a user-selected SAF directory as \`{root}/{showName}/{name}.mp3\` with a configurable naming template.
          - Settings: Settings > Transmission.

          ## Important - runtime verification needed
          This APK is built and unit-tested by CI, but the **runtime transcode flow (FFmpeg native libmp3lame + SAF write + download hook) has NOT been verified on a device**. After installing, please follow the device testing checklist in [docs/DEVICE_TESTING.md](https://github.com/checkcctvwo-star/PodAura/blob/feature/podcast-downloader/docs/DEVICE_TESTING.md) to confirm downloads transcode to MP3 correctly. Report any failures." \
            --prerelease \
            release/*.apk

